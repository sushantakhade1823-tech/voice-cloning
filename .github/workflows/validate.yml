name: Validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python-and-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q app
      - run: docker build -t voiceforge:test .
